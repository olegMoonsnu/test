<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'; connect-src 'none'">
<title>Портал услуг · Демо SMP</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f9;color:#1e263d;font:16px/1.5 Inter,system-ui,Arial,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}button{cursor:pointer}header{background:white;border-bottom:1px solid #dfe3ed}header>div,main,footer{max-width:1120px;margin:auto;padding:0 28px}.bar{display:flex;align-items:center;gap:28px;min-height:74px}.brand{display:flex;align-items:center;gap:12px;font-size:1.15rem;font-weight:730}.mark{display:grid;place-items:center;width:38px;height:38px;background:#34335a;color:white;border-radius:11px;font-weight:750}.nav{display:flex;align-items:center;gap:6px}.nav button,.link,.back{border:0;background:transparent;color:#444b69;padding:9px 12px}.nav button[aria-current=page]{color:#4a4389;background:#eeedf8;border-radius:8px}.demo{margin-left:auto;color:#525a70;font-size:.86rem}main{padding-top:34px;padding-bottom:40px}.hero{border-radius:18px;padding:38px 42px;background:#282b48;color:white;position:relative;overflow:hidden}.hero h1{font-size:clamp(1.8rem,4vw,2.55rem);line-height:1.12;letter-spacing:-.04em;margin:0 0 10px}.hero p{margin:0;color:#dedff2}.motif{position:absolute;right:-10px;top:-64px;width:260px;height:260px;border:22px solid #43456d;border-radius:54px;transform:rotate(32deg)}.motif:before,.motif:after{content:'';position:absolute;inset:11px;border:13px solid #626293;border-radius:29px}.motif:after{inset:42px;border:10px solid #8787b6;border-radius:16px}.hero>div:first-child{position:relative;z-index:1}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;margin-top:28px}h1,h2,h3,p{overflow-wrap:anywhere}h2{font-size:1.35rem;margin:0 0 14px}h3{font-size:1.04rem;margin:0 0 5px}.muted,small{color:#5b657a}small{font-size:.86rem}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0 18px}.chip,.secondary,.primary{border-radius:8px;border:1px solid #ced4e0;padding:7px 14px;background:white;color:#363e54}.chip{font-size:.88rem;border-radius:999px}.chip[aria-pressed=true]{background:#dfdff3;border-color:#c4c3e1;color:#383568}.primary{background:#494381;color:white;border-color:#494381;font-weight:600}.primary:hover{background:#39346d}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card,.box,.ticket{background:white;border:1px solid #dce1ea;border-radius:13px}.card,.ticket{text-align:left;color:inherit}.card{padding:19px;min-height:140px}.card:hover,.ticket:hover{border-color:#918bbb}.card b,.ticket b{display:block;margin:8px 0 3px}.glyph{display:inline-block;font-size:.78rem;font-weight:700;letter-spacing:.08em;color:#5c518d;border-bottom:2px solid #b8afd5}.box{padding:22px;margin-bottom:14px}.box p{margin:4px 0 12px}.aside{align-self:start}.ticket{display:block;width:100%;padding:14px 16px;margin-bottom:9px}.aside .ticket{padding:12px 0;border:none;border-radius:0;border-top:1px solid #e7e8ed}.status{font-size:.84rem;display:inline-block;padding:2px 8px;border-radius:5px;background:#edeafa;color:#504780}.status.work{background:#e4eefb;color:#285381}.status.done{background:#e3f2ea;color:#285d42}.search,input,textarea,select{width:100%;padding:10px 12px;border:1px solid #c8cfdd;border-radius:8px;color:inherit;background:#fff}label{display:block;font-weight:600;margin:14px 0 5px}textarea{min-height:104px;resize:vertical}.back{padding-left:0;color:#48407a}.narrow{max-width:790px;margin:auto}.narrow h1{font-size:1.85rem;margin:10px 0 14px;line-height:1.2}.entry{padding:12px 0;border-top:1px solid #e6e8ef}.entry p,.bodytext{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.link{color:#514982;text-decoration:underline;padding:2px 0}.empty{padding:24px;border:1px dashed #cbd0db;border-radius:10px}.summary{display:flex;gap:12px;align-items:center;flex-wrap:wrap}footer{padding-bottom:24px;color:#676f80;font-size:.86rem}.sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
@media(max-width:820px){.layout{grid-template-columns:1fr}.motif{opacity:.38}.hero{padding:28px}.aside{max-width:none}}@media(max-width:600px){.bar{gap:6px;flex-wrap:wrap;padding-top:12px;padding-bottom:9px}.brand{flex:1}.nav{order:3;width:100%}header>div,main,footer{padding-left:16px;padding-right:16px}main{padding-top:16px}.cards{grid-template-columns:1fr}.card{min-height:0;padding:14px 17px}.hero{padding:24px 18px}.motif{display:none}.box{padding:16px}}
</style>
<header><div class="bar"><span class="brand"><span class="mark" aria-hidden="true">S</span>Портал услуг</span><nav class="nav" aria-label="Разделы"><button id="catalogNav">Каталог</button><button id="ticketsNav">Мои заявки</button></nav><span class="demo">Демо SMP</span></div></header>
<main id="app" tabindex="-1"></main><p id="notice" role="status" class="sr"></p><footer>Демонстрационные данные. Изменения действуют до перезагрузки страницы.</footer>
<script>
'use strict';
const services=[
 {id:'access',group:'Доступы',name:'Доступ к приложению',desc:'Подключение к корпоративной системе',code:'ID'},
 {id:'network',group:'Связь',name:'Подключение к VPN',desc:'Помощь с удалённым доступом к сети',code:'VPN'},
 {id:'device',group:'Техника',name:'Выдача оборудования',desc:'Монитор, гарнитура или рабочий ноутбук',code:'HW'},
 {id:'mail',group:'Связь',name:'Корпоративная почта',desc:'Вопросы о почтовом ящике и рассылках',code:'@'},
 {id:'program',group:'Доступы',name:'Установка программы',desc:'Установка приложения на рабочий компьютер',code:'APP'},
 {id:'repair',group:'Техника',name:'Ремонт рабочего места',desc:'Диагностика неисправного устройства',code:'IT'}];
const app=document.getElementById('app'), statuses=['Новая','В работе','Решена'];
const tickets=[];let next=1043,group='Все',query='',filter='Все';
const stamp=()=>new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
function seed(id,service,title,state,body){tickets.push({id,service,title,state,body,importance:'Обычная',events:[{who:'Система',time:'Демо',msg:'Заявка зарегистрирована.'},...(state? [{who:'Служба поддержки',time:'Демо',msg:state===1?'Заявка принята в работу.':'Работы завершены.'}] :[])]});}
seed(1042,'network','Не подключается VPN',1,'При подключении к рабочей сети появляется ошибка соединения.');
seed(1041,'device','Дополнительный монитор',2,'Нужен второй монитор для рабочего места.');
function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}
function btn(text,fn,cls='secondary'){const b=el('button',text,cls);b.type='button';b.onclick=fn;return b}
function go(path){if(location.hash==='#'+path)render();else location.hash=path}
function note(text){document.getElementById('notice').textContent=text}
function badge(t){return el('span',statuses[t.state],'status '+['','work','done'][t.state])}
function ticket(t){const b=btn('',()=>go('ticket/'+t.id),'ticket');b.append(el('small','№ '+t.id),el('b',t.title),badge(t));return b}
function box(title){const b=el('section',null,'box');if(title)b.append(el('h2',title));return b}
function labeled(form,title,input,id){const label=el('label',title);input.id=id;label.htmlFor=id;form.append(label,input)}
function hero(title,desc){const h=el('section',null,'hero'),wrap=el('div');wrap.append(el('h1',title),el('p',desc));const motif=el('div',null,'motif');motif.setAttribute('aria-hidden','true');h.append(wrap,motif);return h}
function catalog(){
 app.append(hero('Чем вам помочь?','Выберите услугу, чтобы обратиться в службу поддержки.'));
 const layout=el('div',null,'layout'),left=el('section'),aside=el('aside',null,'box aside');layout.append(left,aside);app.append(layout);
 const search=el('input');search.type='search';search.placeholder='Найти услугу';search.setAttribute('aria-label','Найти услугу');search.value=query;
 const chips=el('div',null,'tools'),cards=el('div',null,'cards');left.append(el('h2','Каталог услуг'),search,chips,cards);
 function draw(){cards.replaceChildren();const matches=services.filter(s=>(group==='Все'||s.group===group)&&(s.name+' '+s.group+' '+s.desc).toLowerCase().includes(query.trim().toLowerCase()));
 for(const s of matches){const b=btn('',()=>go('new/'+s.id),'card');b.append(el('span',s.code,'glyph'),el('b',s.name),el('small',s.desc));cards.append(b)}
 if(!matches.length)cards.append(el('p','Подходящих услуг нет. Измените запрос или категорию.','empty'));
 for(const chip of chips.children)chip.setAttribute('aria-pressed',String(chip.textContent===group));}
 for(const g of ['Все','Доступы','Связь','Техника'])chips.append(btn(g,()=>{group=g;draw()},'chip'));
 search.oninput=()=>{query=search.value;draw()};draw();
 aside.append(el('h2','Последние заявки'));tickets.slice().sort((a,b)=>b.id-a.id).slice(0,3).forEach(t=>aside.append(ticket(t)));aside.append(btn('Все мои заявки',()=>go('tickets'),'link'));
}
function list(){app.append(hero('Мои заявки','Откройте обращение, чтобы посмотреть историю и добавить комментарий.'));
 const chips=el('div',null,'tools'),items=el('section');app.append(chips,items);
 function draw(){items.replaceChildren();for(const t of tickets.slice().sort((a,b)=>b.id-a.id))if(filter==='Все'||statuses[t.state]===filter)items.append(ticket(t));if(!items.childElementCount)items.append(el('p','Заявок с таким статусом пока нет.','empty'));for(const b of chips.children)b.setAttribute('aria-pressed',String(b.textContent===filter))}
 for(const s of ['Все',...statuses])chips.append(btn(s,()=>{filter=s;draw()},'chip'));draw()
}
function request(s){const w=el('div',null,'narrow');app.append(w);w.append(btn('В каталог услуг',()=>go('catalog'),'back'),el('h1',s.name));
 const f=el('form',null,'box'),title=el('input'),body=el('textarea'),importance=el('select');title.required=body.required=true;title.maxLength=100;body.maxLength=2000;
 title.placeholder='Кратко опишите задачу';body.placeholder='Что требуется сделать?';for(const val of ['Обычная','Высокая'])importance.append(el('option',val));labeled(f,'Тема заявки',title,'subject');labeled(f,'Описание',body,'description');labeled(f,'Важность',importance,'priority');
 const send=el('button','Отправить заявку','primary');send.type='submit';const actions=el('div',null,'actions');actions.append(send,btn('Отмена',()=>go('catalog')));f.append(actions);w.append(f);
 f.onsubmit=e=>{e.preventDefault();for(const field of [title,body]){if(!field.value.trim()){field.setCustomValidity('Введите текст.');field.reportValidity();return}}const t={id:next++,service:s.id,title:title.value.trim(),body:body.value.trim(),importance:importance.value,state:0,events:[{who:'Система',time:stamp(),msg:'Заявка зарегистрирована.'}]};tickets.unshift(t);filter='Все';note('Заявка № '+t.id+' создана');go('ticket/'+t.id)};for(const field of [title,body])field.oninput=()=>field.setCustomValidity('')
}
function detail(t){const w=el('div',null,'narrow');app.append(w);w.append(btn('К моим заявкам',()=>go('tickets'),'back'));const meta=el('div',null,'summary');meta.append(el('small','Заявка № '+t.id),badge(t));w.append(meta,el('h1',t.title));
 const info=box('Описание');info.append(el('p',t.body,'bodytext'),el('small',services.find(s=>s.id===t.service).name+' · Важность: '+t.importance));w.append(info);
 const history=box('История заявки');w.append(history);for(const ev of t.events){const e=el('div',null,'entry');e.append(el('strong',ev.who),el('small',' · '+ev.time),el('p',ev.msg));history.append(e)}
 const f=el('form'),comment=el('textarea');comment.maxLength=1500;comment.required=true;labeled(f,'Комментарий',comment,'comment');const send=el('button','Добавить комментарий','primary');send.type='submit';const actions=el('div',null,'actions');actions.append(send);f.append(actions);history.append(f);
 f.onsubmit=e=>{e.preventDefault();if(!comment.value.trim()){comment.setCustomValidity('Введите текст.');comment.reportValidity();return}t.events.push({who:'Вы',time:stamp(),msg:comment.value.trim()});note('Комментарий добавлен');render();document.getElementById('comment').focus()};comment.oninput=()=>comment.setCustomValidity('');
 const sim=box('Действие специалиста');sim.append(el('p','В демо вы можете проверить следующий этап обработки заявки.','muted'));
 const labels=['Принять в работу','Отметить решённой','Вернуть в работу'];sim.append(btn(labels[t.state],()=>{t.state=t.state===1?2:1;t.events.push({who:'Демо-специалист',time:stamp(),msg:'Статус изменён: '+statuses[t.state]+'.'});note('Статус: '+statuses[t.state]);render()}));w.append(sim)
}
function render(){const [p,id]=location.hash.slice(1).split('/');app.replaceChildren();const t=tickets.find(x=>String(x.id)===id),s=services.find(x=>x.id===id);
 const inTickets=p==='tickets'||(p==='ticket'&&t);document.getElementById('catalogNav').setAttribute('aria-current',inTickets?'false':'page');document.getElementById('ticketsNav').setAttribute('aria-current',inTickets?'page':'false');
 if(p==='new'&&s)request(s);else if(p==='ticket'&&t)detail(t);else if(p==='tickets'||p==='ticket')list();else catalog();window.scrollTo(0,0)}
document.getElementById('catalogNav').onclick=()=>go('catalog');document.getElementById('ticketsNav').onclick=()=>go('tickets');window.addEventListener('hashchange',()=>{render();app.focus({preventScroll:true})});render();
</script></html>
