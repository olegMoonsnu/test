name: Verify studio
on:
  push:
    branches: [main, nsd-customization]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build && git diff --exit-code -- dist/ groovy/table-studio/nsdAnalyticsStudio.groovy
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify the standalone Groovy bridge
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/org/codehaus/groovy/groovy-all/2.4.21/groovy-all-2.4.21.jar -o "$RUNNER_TEMP/groovy-all.jar"
          echo "de65260cf2070442e99882f2f3d72e7531725c1e6a257446cc0cea525c607bd0  $RUNNER_TEMP/groovy-all.jar" | sha256sum -c -
          GROOVY_JAR="$RUNNER_TEMP/groovy-all.jar" bash scripts/test-groovy.sh
      - name: Select the runner browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright-core install --with-deps chromium
          fi
      - run: npm run test:browser
      - run: node tests/table-module-browser.mjs
      - run: npm run bench
      - uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-output/screenshots/
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish v0.1.0 once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f docs/release-v0.1.0.md || exit 0
          if gh release view v0.1.0 >/dev/null 2>&1; then exit 0; fi
          sha256sum dist/nsd-analytics.js dist/nsd-analytics.min.js > SHA256SUMS
          git archive --format=zip --prefix=nsd-analytics-studio/ --output=nsd-analytics-studio-v0.1.0.zip HEAD
          gh release create v0.1.0 --target "$GITHUB_SHA" --title "NSD Analytics Studio v0.1.0" --notes-file docs/release-v0.1.0.md dist/nsd-analytics.js dist/nsd-analytics.min.js SHA256SUMS nsd-analytics-studio-v0.1.0.zip
